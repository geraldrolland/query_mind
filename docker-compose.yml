services:
  postgres:
    image: postgres:16-alpine
    container_name: querymind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: querymind123
      POSTGRES_DB: querymind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: querymind-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: querymind-backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:querymind123@postgres:5432/querymind
      REDIS_URL: redis://redis:6379/0
      REDIS_REFRESH_DB: 1
      APP_HOST: http://localhost:3001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 163434023770-jrammnrou2vhf3m1e4uqb7o7sir868fr.apps.googleusercontent.com
    container_name: querymind-frontend
    command: ["npm", "run", "dev"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 163434023770-jrammnrou2vhf3m1e4uqb7o7sir868fr.apps.googleusercontent.com
      NODE_OPTIONS: --max-old-space-size=1024

    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
